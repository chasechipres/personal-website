# nginx site for chasechipres.com. Installed at /etc/nginx/sites-available/chasechipres
# and symlinked into sites-enabled. The TLS lines point at the certbot-managed cert.

server {
    listen 443 ssl;
    listen [::]:443 ssl ipv6only=on;
    server_name chasechipres.com www.chasechipres.com;

    ssl_certificate /etc/letsencrypt/live/chasechipres.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chasechipres.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # "current" is a symlink to the active release; deploys swap it atomically.
    root /var/www/chasechipres/current;
    index index.html;
    error_page 404 /404.html;

    # Hashed build assets never change, so they can be cached forever.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # HTML must revalidate so a deploy shows up immediately.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name chasechipres.com www.chasechipres.com;
    return 301 https://$host$request_uri;
}
